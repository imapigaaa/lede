name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 开启SSH调试
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tmate SSH 调试
        if: github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: 打包固件
        run: |
          tar -czf openwrt-firmware.tar.gz bin/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt-firmware.tar.gz
