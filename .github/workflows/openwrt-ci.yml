name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 开启SSH调试
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 【第一步，虚拟机启动立刻打开tmate SSH，暂停流水线】
      - name: SSH tmate 调试
        if: github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true # 仅允许你本人连接，别人拿链接也进不来

      # 检出你仓库里的lean源码
      - name: Checkout
        uses: actions/checkout@v4

      # 打包固件
      - name: 打包固件
        run: |
          tar -czf openwrt-firmware.tar.gz bin/

      # 上传产物，单独一步
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt-firmware.tar.gz
