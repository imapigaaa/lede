name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 开启SSH调试
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ========= 【第一步！虚拟机启动立刻进入SSH，卡在这】 =========
      - name: SSH调试 tmate
        if: github.event.inputs.ssh == 'true'
        uses: P3TERX/debugger-action@master

      # 下面是后续自动步骤；SSH里面你手动编译完输入continue，才会执行下面
      - name: Checkout
        uses: actions/checkout@v4

      - name: 打包固件上传
        if: success()
        run: |
          tar -czf openwrt-firmware.tar.gz bin/
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt-firmware.tar.gz
