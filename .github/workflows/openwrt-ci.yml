name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 开启SSH调试
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 第一步：开机立刻tmate SSH等待连接
      - name: SSH调试 tmate
        if: github.event.inputs.ssh == 'true'
        uses: P3TERX/debugger-action@master

      # 检出仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 【STEP1 打包】只执行shell命令
      - name: 打包固件
        run: |
          tar -czf openwrt-firmware.tar.gz bin/

      # 【STEP2 单独一步上传】uses写在这里，独立step
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt-firmware.tar.gz
