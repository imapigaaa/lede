name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 开启SSH调试
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 第一步：开机立刻tmate SSH等待连接
      - name: SSH调试 tmate
        if: github.event.inputs.ssh == 'true'
        uses: P3TERX/debugger-action@master

      # 检出仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 打包固件
      - name: 打包固件
        run: |
          tar -czf openwrt-firmware.tar.gz lede/bin/targets/ramips/mt76x8/

      # 上传产物，这一段单独一个step！！之前就是这里错了
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt-firmware.tar.gz
